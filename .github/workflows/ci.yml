name: CI

# Lint and build.
#
# This workflow previously also ran `npm test` (75 unit tests), a mutation
# harness that reintroduced each historical bug and required the corresponding
# check to go red, and a smoke test against the live site. All of that was
# deleted on 2026-08-01 by request.
#
# It also ran `npm run check`, a schema guard reading the tracked SQL dump. That
# went on 2026-08-02 with the SQL itself. Nothing now catches a column added to
# contact_us but missing from the public.visible_contacts view — that drift
# produces no error and nothing on screen, so check it by hand after any
# migration.
#
# What is still not covered: a build passing here proves the code compiles and
# lints. It does not prove the app runs. Two of the four bugs that prompted the
# removed checks — a lucide icon crossing the Server/Client boundary, and an
# import route that had never inserted a row — were valid JavaScript that lint
# and build accepted, and nothing here would catch their equivalents today.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # There is no postinstall step any more. It ran scripts/patch-neon-auth.mjs,
      # which guarded @neondatabase/auth's cookieStore.set() so a rotating session
      # token could not throw inside a Server Component. The upstream call is
      # still unguarded as of 0.4.1-beta; the guard now lives in src/lib/auth.js
      # instead, where it needs no install-time step. See that file for why it
      # cannot sit any closer to the failing write.
      - run: npm ci

      # The baseline is zero. --max-warnings=0 lives in the lint script itself,
      # not here — a check that is stricter in CI than on a developer's machine
      # recreates the local/CI gap.
      - run: npm run lint

      # Placeholders, not secrets. `neon()` and createNeonAuth parse these at
      # module load and the build fails without them, but nothing connects or
      # authenticates while building, so syntactically valid junk is enough.
      # Keeping real credentials out of this job is the point: it runs on every
      # push, including from forks.
      #
      # NEON_AUTH_COOKIE_SECRET must be at least 32 characters — createNeonAuth
      # rejects anything shorter, and it does so while Next is collecting page
      # data, so the failure reads "Failed to collect page data for
      # /api/auth/[...path]" rather than naming the variable. The value below is
      # 37 characters; do not shorten it.
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost/ci
          NEON_AUTH_BASE_URL: https://auth.example.invalid
          NEON_AUTH_COOKIE_SECRET: ci-placeholder-not-used-at-build-time
