name: CI

# Lint and build. That is the whole bar.
#
# This workflow previously also ran `npm test` (75 unit tests), a mutation
# harness that reintroduced each historical bug and required the corresponding
# check to go red, three constraint guards, and a smoke test against the live
# site. All of that was deleted on 2026-08-01 by request; the commit that
# removed it holds the full contents if any of it is wanted back.
#
# What that means in practice: a build passing here proves the code compiles and
# lints. It does not prove the app runs. The four bugs that prompted the removed
# checks — a CHECK constraint rejecting a value the code always wrote, a lucide
# icon crossing the Server/Client boundary, isBlank treating every Date as
# blank, and an import route that had never inserted a row — were all valid
# JavaScript that lint and build accepted. Nothing here would catch their
# equivalents today.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # postinstall runs scripts/patch-neon-auth.mjs, which exits non-zero if
      # the code it patches has moved. That is deliberate: a package bump that
      # fixes the upstream bug should fail loudly here rather than silently.
      # It is now the only automated check with any knowledge of runtime
      # behaviour.
      - run: npm ci

      # The baseline is zero. --max-warnings=0 lives in the lint script itself,
      # not here — a check that is stricter in CI than on a developer's machine
      # recreates the local/CI gap.
      - run: npm run lint

      # Placeholders, not secrets. `neon()` and createNeonAuth parse these at
      # module load and the build fails without them, but nothing connects or
      # authenticates while building, so syntactically valid junk is enough.
      # Keeping real credentials out of this job is the point: it runs on every
      # push, including from forks.
      #
      # NEON_AUTH_COOKIE_SECRET must be at least 32 characters — createNeonAuth
      # rejects anything shorter, and it does so while Next is collecting page
      # data, so the failure reads "Failed to collect page data for
      # /api/auth/[...path]" rather than naming the variable. The value below is
      # 37 characters; do not shorten it.
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost/ci
          NEON_AUTH_BASE_URL: https://auth.example.invalid
          NEON_AUTH_COOKIE_SECRET: ci-placeholder-not-used-at-build-time
